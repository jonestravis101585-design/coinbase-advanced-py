name: Coinbase Account Agent

on:
  pull_request:
  push:
    branches: [master, codex/coinbase-account-agent]

permissions:
  contents: read

jobs:
  offline-agent-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r examples/coinbase_agent/requirements.txt -r test_requirements.txt
      - run: python -m unittest discover -s examples/coinbase_agent/tests -v

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'Coinbase Agent'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install through the Windows launcher in a folder with spaces
        working-directory: 'Coinbase Agent'
        shell: cmd
        run: call "Start Coinbase Agent.cmd" --list-tools
      - name: Run offline tests on Windows
        working-directory: 'Coinbase Agent'
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pip install -r test_requirements.txt
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m unittest discover -s examples/coinbase_agent/tests -v
      - name: Verify subsequent launches and the interactive menu
        working-directory: 'Coinbase Agent'
        shell: cmd
        run: |
          call "Start Coinbase Agent.cmd" --read-only --list-tools
          if errorlevel 1 exit /b 1
          echo 0| call "Start Coinbase Agent.cmd" --menu
